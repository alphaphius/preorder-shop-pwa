<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6d28d9" />
<meta name="description" content="ร้านค้าสินค้าพร้อมส่งและ Pre-order" />
<link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
<link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
<title>Preorder Shop</title>
<script>
  (() => {
    const saved = localStorage.getItem('shop.theme') || 'system'
    const resolved = saved === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : saved
    document.documentElement.dataset.theme = resolved
  })()
</script>
<div id="root"></div>
<script src="%BASE_URL%runtime-config.js"></script>
<script type="module" src="/src/main.tsx"></script>

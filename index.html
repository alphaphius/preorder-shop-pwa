<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6d28d9" />
<meta name="description" content="ร้านค้าสินค้าพร้อมส่งและ Pre-order" />
<link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
<link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
<title>Preorder Shop</title>
<script>
  (() => {
    const saved = localStorage.getItem('shop.theme') || 'system'
    const resolved = saved === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : saved
    document.documentElement.dataset.theme = resolved
  })()
</script>
<style>
  .boot-loader{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#faf7ff;color:#2b2432;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.boot-loader>div{display:grid;justify-items:center;gap:14px;text-align:center}.boot-loader i{width:54px;height:54px;border:5px solid #e9ddff;border-top-color:#6d28d9;border-radius:50%;animation:boot-spin .8s linear infinite}.boot-loader strong{font-size:1.05rem}.boot-loader span{max-width:360px;color:#6f6478;line-height:1.55}@keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-color-scheme:dark){.boot-loader{background:#17121d;color:#fff}.boot-loader span{color:#c7bbd0}}@media(prefers-reduced-motion:reduce){.boot-loader i{animation-duration:1.8s}}
</style>
<div id="root"><main class="boot-loader" aria-live="polite" aria-busy="true"><div><i aria-hidden="true"></i><strong>กำลังเปิดร้านค้า…</strong><span>กำลังเชื่อมต่อ Google Apps Script และอ่านข้อมูลจาก Google Sheet</span></div></main></div>
<script src="%BASE_URL%runtime-config.js"></script>
<script type="module" src="/src/main.tsx"></script>
